prompt:
  goal_description: "回答开发者问题并引用检索证据"
  init_template: prompt/search_o1_reasoning.jinja
  reasoning_template: prompt/search_o1_refinement.jinja
  finalize_template: prompt/search_o1_finalize.jinja
  token_contract:
    begin_query: "<<SRCH_Q_BEGIN>>"
    end_query: "<<SRCH_Q_END>>"
    end_answer: "<<FINAL_ANSWER_END>>"

router:
  token_contract:
    begin_query: "<<SRCH_Q_BEGIN>>"
    end_query: "<<SRCH_Q_END>>"
    end_answer: "<<FINAL_ANSWER_END>>"

custom:
  token_contract:
    begin_query: "<<SRCH_Q_BEGIN>>"
    end_query: "<<SRCH_Q_END>>"
    end_answer: "<<FINAL_ANSWER_END>>"
    begin_result: "<<SRCH_R_BEGIN>>"
    end_result: "<<SRCH_R_END>>"

generation:
  model_name: ""
  base_url: ""
  api_key: ""
  sampling_params:
    timeout: 600
    max_tokens: 2048
    temperature: 0.2
    top_p: 0.8
    extra_body:
      include_stop_str_in_output: true
      stop: []

retriever:
  chroma_path: null
  chroma_collection: modelscope_docs
  embedding_api_url: null
  embedding_api_key: null
  embedding_timeout: 60
  top_k: 10
  query_instruction: "Query: "

loop:
  times: 2
